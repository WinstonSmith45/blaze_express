{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Blaze Dashboard</title>
  <link rel="stylesheet" href="{% static 'dashboard/style.css' %}">
</head>
<body class="login-page">
  <form class="login-card" method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <h1 class="login-brand">Blaze Dashboard</h1>
    <p class="muted">Войдите, чтобы продолжить</p>

    {% if form.non_field_errors %}
      <div class="login-error">{% for error in form.non_field_errors %}{{ error }}{% endfor %}</div>
    {% endif %}

    <label for="id_username">Имя пользователя</label>
    <input type="text" name="username" id="id_username" autocomplete="username" required autofocus
           value="{{ form.username.value|default_if_none:'' }}">

    <label for="id_password">Пароль</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>

    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="primary">Войти</button>
  </form>
</body>
</html>
